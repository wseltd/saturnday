name: Governance
on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce:
    name: enforce
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install saturnday
        run: pip install -e .

      - name: Secret scan (fast-fail)
        run: |
          python3 << 'PYEOF'
          import subprocess, sys, os
          from pathlib import Path

          # Get changed files
          base = os.environ.get("GITHUB_BASE_REF", "main")
          result = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", f"origin/{base}...HEAD"],
              capture_output=True, text=True
          )
          changed = [f for f in result.stdout.strip().split("\n") if f and os.path.isfile(f)]
          if not changed:
              print("Secret scan: PASS (no changed files)")
              sys.exit(0)

          from saturnday.review import _scan_secrets
          scan_result = _scan_secrets(Path("."), changed)
          findings = scan_result["findings"]
          if findings:
              print(f"SECRETS FOUND: {len(findings)} finding(s)")
              for f in findings:
                  print(f"  - {f['path']}: {f['match_preview']}")
              sys.exit(1)
          print(f"Secret scan: PASS ({len(changed)} files checked, 0 findings)")
          PYEOF

      - name: Run governance checks
        id: governance
        run: |
          python -m saturnday check \
            --repo . \
            --diff "origin/${{ github.base_ref }}...HEAD" \
            --output evidence/governance/ \
            --strict
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run performance benchmark (delta)
        run: |
          python scripts/benchmark_governance.py \
            --mode delta \
            --output evidence/governance/benchmark.json

      - name: Verify governance status consistency
        run: |
          python scripts/collect_governance_stats.py \
            --output evidence/governance/governance_status.json

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-evidence
          path: evidence/governance/
          retention-days: 90
